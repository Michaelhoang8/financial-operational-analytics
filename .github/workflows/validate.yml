name: Validate real-data analysis
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/verify_source.py
      - run: python src/build.py
      - run: python src/build_powerbi.py
      - run: python -m unittest discover -s tests -v
